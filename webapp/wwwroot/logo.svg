<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 50" width="135" height="50">
  <!-- Stylized envelope with arrow -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <!-- Envelope base -->
    <path d="M5 12 L5 38 L45 38 L45 12 Z" stroke-linejoin="round"/>
    <!-- Envelope flap -->
    <path d="M5 12 L25 26 L45 12"/>
  </g>

  <!-- Send arrow coming out -->
  <g fill="#ffffff">
    <path d="M35 20 L50 15 L50 25 Z"/>
    <rect x="28" y="18" width="12" height="4" rx="1"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="12" cy="32" r="2" fill="#ffffff"/>
  <circle cx="20" cy="32" r="2" fill="#ffffff"/>
  <circle cx="28" cy="32" r="2" fill="#ffffff"/>

  <!-- Company name -->
  <text x="58" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    MyApp
  </text>
</svg>
